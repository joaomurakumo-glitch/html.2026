<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Temperatura</title>
        <link rel="stylesheet" 
    type="text/css" 
    href="../css/estilo.css">

</head>
<body>
    
    <h3>Conversor de Temperatura</h3>
    <p>Escolha o tipo de conversão, insira o valor e clique em converter.</p>
    
    <form onsubmit="executar(event)" onreset="resetar()">
        <label for="idOperacao">Converter de:</label><br>
        <select id="idOperacao" required>
            <option value="CtoF">Celsius (°C) para Fahrenheit (°F)</option>
            <option value="FtoC">Fahrenheit (°F) para Celsius (°C)</option>
        </select>
        <br><br>

        <label for="idTemperatura">Temperatura:</label><br>
        <input id="idTemperatura" type="number" step="any" required placeholder="Ex.: 25">
        <br><br>

        <label id="idResultado"></label>
        <br><br>

        <button type="submit">Converter</button>
        <button type="reset">Limpar</button>
        <button type="button" onclick="retornar()">Retornar</button>
    </form>

    <script src="../js/comum.js"></script>
    <script src="../js/exercicio09.js"></script>
</body>
</html>
