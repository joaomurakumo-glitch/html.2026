<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>
        <link rel="stylesheet" 
    type="text/css" 
    href="../css/estilo.css">

</head>
<body>
    
    <h3>Calculadora de IMC</h3>
    <p>Insira seu peso e sua altura para calcular o seu Índice de Massa Corporal.</p>
    
    <form onsubmit="executar(event)" onreset="resetar()">
        <label for="idPeso">Informe seu Peso (kg):</label><br>
        <input id="idPeso" type="number" step="0.1" required placeholder="Ex.: 70.5">
        <br><br>

        <label for="idAltura">Informe sua Altura (metros):</label><br>
        <input id="idAltura" type="number" step="0.01" required placeholder="Ex.: 1.75">
        <br><br>

        <label id="idResultado"></label>
        <br><br>

        <button type="submit">Calcular IMC</button>
        <button type="reset">Limpar</button>
        <button type="button" onclick="retornar()">Retornar</button>
    </form>

    <script src="../js/comum.js"></script>
    <script src="../js/exercicio10.js"></script>
</body>
</html>
