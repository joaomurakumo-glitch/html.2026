<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparador de Números</title>
        <link rel="stylesheet" 
    type="text/css" 
    href="../css/estilo.css">

</head>
<body>
    
    <h3>Comparador de Três Números</h3>
    <p>Insira três números diferentes para descobrir qual deles é o maior e qual é o menor.</p>
    
    <form onsubmit="executar(event)" onreset="resetar()">
        <label for="idNum1">Primeiro Número:</label><br>
        <input id="idNum1" type="number" step="any" required placeholder="Ex.: 10">
        <br><br>

        <label for="idNum2">Segundo Número:</label><br>
        <input id="idNum2" type="number" step="any" required placeholder="Ex.: 25">
        <br><br>

        <label for="idNum3">Terceiro Número:</label><br>
        <input id="idNum3" type="number" step="any" required placeholder="Ex.: 7">
        <br><br>

        <label id="idResultado"></label>
        <br><br>

        <button type="submit">Comparar</button>
        <button type="reset">Limpar</button>
        <button type="button" onclick="retornar()">Retornar</button>
    </form>

    <script src="../js/comum.js"></script>
    <script src="../js/exercicio12.js"></script>
</body>
</html>
