<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Pré-Matrícula</title>
</head>

<body>

<form>

<h1 align="center">Escola Virtual</h1>
<h2 align="center">Formulário de Pré-Matrícula</h2>

<!-- DADOS PESSOAIS -->
<fieldset>
<legend>Dados Pessoais:</legend>

<label for="aluno">Nome do Aluno:</label>
<input type="text" id="aluno" name="aluno">
<br><br>

<label>Masceimento (dd/mm/aaaa):</label>
<input type="text" size="2"> /
<input type="text" size="2"> /
<input type="text" size="4">
<br><br>

<label for="mae">Nome da Mãe:</label>
<input type="text" id="mae" name="mae">
<br><br>

<label for="pai">Nome do Pai:</label>
<input type="text" id="pai" name="pai">
<br><br>

<label>Telefone:</label>
<label for="ddd">DDD</label>
<input type="text" id="ddd" size="3">

<label for="tel">Tel</label>
<input type="text" id="tel" size="8">

<label for="ramal">Ramal</label>
<input type="text" id="ramal" size="5">
<br><br>

<label for="email">E-Mail:</label>
<input type="email" id="email" name="email">

</fieldset>

<br>

<!-- INFORMAÇÕES DE MATRÍCULA -->
<fieldset>
<legend>Informações de Matrícula:</legend>

<label for="serie">Série:</label>
<select id="serie" name="serie">
    <option>pré-escolar</option>
    <option>1º ano</option>
    <option>2º ano</option>
    <option>3º ano</option>
</select>

<br><br>

<label>Turno:</label>
<input type="radio" id="manha" name="turno">
<label for="manha">Manhã</label>

<input type="radio" id="tarde" name="turno">
<label for="tarde">Tarde</label>

<br><br>

<label>Atividades Extracurriculares:</label><br>

<input type="checkbox" id="info">
<label for="info">Informática</label><br>

<input type="checkbox" id="musica">
<label for="musica">Música</label><br>

<input type="checkbox" id="ballet">
<label for="ballet">Balet</label><br>

<input type="checkbox" id="pintura">
<label for="pintura">Pintura</label><br>

<input type="checkbox" id="judo">
<label for="judo">Judô</label><br>

<input type="checkbox" id="futebol">
<label for="futebol">Futebol</label>

</fieldset>

<br>

<!-- BOTÕES -->
<input type="submit" value="Envia Formulário">
<input type="reset" value="Limpa Campos">

</form>

</body>
</html>
